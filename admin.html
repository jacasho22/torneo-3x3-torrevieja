<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Open 3x3 Torrevieja</title>
    <style>
        /* Hallmark · genre: editorial · macrostructure: app (existing IA preserved) · theme: custom Sport-cluster (design.md) · enrichment: none · designed-as-app */
        @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap');

        :root {
            --color-paper:      oklch(97% 0.012 55);
            --color-paper-2:    oklch(94% 0.014 55);
            --color-ink:        oklch(19% 0.014 55);
            --color-ink-2:      oklch(28% 0.05 250);
            --color-rule:       oklch(84% 0.014 55);
            --color-neutral:    oklch(50% 0.01 55);
            --color-accent:     oklch(62% 0.19 38);
            --color-accent-ink: oklch(98% 0.01 38);
            --color-success:    oklch(58% 0.14 155);
            --color-warning:    oklch(66% 0.15 75);
            --color-error:      oklch(56% 0.19 25);
            --color-focus:      oklch(62% 0.19 38);

            --font-display: 'Big Shoulders Display', ui-sans-serif, sans-serif;
            --font-body:    'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
            --font-mono:    'Geist Mono', ui-monospace, monospace;

            --space-3xs: 0.125rem;
            --space-2xs: 0.25rem;
            --space-xs:  0.5rem;
            --space-sm:  0.75rem;
            --space-md:  1rem;
            --space-lg:  1.5rem;
            --space-xl:  2.5rem;

            --text-xs: 0.72rem;
            --text-sm: 0.9rem;
            --text-md: 1.125rem;
            --text-lg: 1.4rem;
            --text-xl: 1.9rem;

            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
            --dur-micro: 120ms;
            --dur-short: 220ms;

            --radius: 4px;
            --radius-lg: 6px;
        }

        html { overflow-x: clip; }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow-x: clip;
            font-family: var(--font-body);
            background-color: var(--color-paper);
            color: var(--color-ink);
            line-height: 1.6;
        }

        .container {
            max-width: 90ch;
            margin: 0 auto;
            padding: var(--space-lg) var(--space-md);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: var(--space-md);
            border-top: 1px solid var(--color-ink);
            border-bottom: 1px solid var(--color-ink);
            padding-top: var(--space-md);
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: var(--text-xl);
            letter-spacing: -0.01em;
            color: var(--color-ink);
        }

        .btn {
            padding: 0.7rem var(--space-md);
            font-size: var(--text-sm);
            font-weight: 600;
            font-family: var(--font-body);
            border: 1px solid transparent;
            border-radius: var(--radius);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: transform var(--dur-micro) var(--ease-out), border-color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
            white-space: nowrap;
        }

        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
        .btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }

        .btn-primary {
            background: var(--color-ink-2);
            color: var(--color-accent-ink);
        }

        .btn-secondary {
            background: transparent;
            border-color: var(--color-ink-2);
            color: var(--color-ink-2);
        }

        .btn-secondary:hover {
            background: var(--color-paper-2);
        }

        .btn-ghost {
            background: transparent;
            border-color: var(--color-rule);
            color: var(--color-neutral);
        }

        .btn-success {
            background: var(--color-success);
            color: var(--color-accent-ink);
        }

        .btn-warning {
            background: var(--color-warning);
            color: var(--color-ink);
        }

        .btn-danger {
            background: transparent;
            border-color: var(--color-error);
            color: var(--color-error);
        }

        .btn-sm { padding: 0.5rem 0.9rem; font-size: var(--text-xs); }

        #loginSection {
            max-width: 28rem;
            margin: var(--space-xl) auto;
            width: 100%;
            padding: var(--space-xl);
            background: var(--color-paper);
            border: 1px solid var(--color-rule);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }

        #loginSection h2 {
            font-family: var(--font-display);
            font-weight: 800;
            color: var(--color-ink-2);
            text-align: center;
            margin-bottom: var(--space-sm);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
        }

        label {
            font-size: var(--text-xs);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--color-ink-2);
        }

        input {
            padding: 0.8rem var(--space-sm);
            border: 1px solid var(--color-rule);
            border-radius: var(--radius);
            font-size: 1rem;
            font-family: inherit;
            background: var(--color-paper);
            color: var(--color-ink);
            transition: border-color var(--dur-short) var(--ease-out);
        }

        input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: 0 0 0 3px oklch(62% 0.19 38 / 0.16);
        }

        .alert {
            padding: var(--space-md);
            border-radius: var(--radius);
            font-size: var(--text-sm);
            display: none;
            border: 1px solid;
        }

        .alert.show { display: block; }

        .alert-error {
            background: oklch(56% 0.19 25 / 0.08);
            color: var(--color-error);
            border-color: var(--color-error);
        }

        .alert-success {
            background: oklch(58% 0.14 155 / 0.08);
            color: var(--color-success);
            border-color: var(--color-success);
        }

        #adminSection { display: none; }

        .stats-bar {
            display: flex;
            gap: var(--space-md);
            flex-wrap: wrap;
        }

        .stat-pill {
            padding: var(--space-sm) var(--space-md);
            background: var(--color-paper);
            border: 1px solid var(--color-rule);
            border-radius: var(--radius);
            font-size: var(--text-sm);
        }

        .stat-pill strong {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
            color: var(--color-ink-2);
            display: block;
            font-size: 1.4rem;
            font-weight: 500;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: var(--space-md);
        }

        .team-card {
            background: var(--color-paper);
            border: 1px solid var(--color-rule);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            margin-bottom: var(--space-md);
            transition: border-color var(--dur-short) var(--ease-out);
        }

        .team-card.paid { border-color: var(--color-success); }

        .team-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: var(--space-md);
            margin-bottom: var(--space-md);
        }

        .team-name {
            font-family: var(--font-display);
            font-size: var(--text-lg);
            font-weight: 700;
            color: var(--color-ink);
        }

        .team-meta {
            font-size: var(--text-sm);
            color: var(--color-neutral);
            line-height: 1.7;
        }

        .payment-pill {
            display: inline-block;
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            font-size: var(--text-xs);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .payment-pill.paid {
            background: oklch(58% 0.14 155 / 0.14);
            color: var(--color-success);
        }

        .payment-pill.pending {
            background: oklch(66% 0.15 75 / 0.16);
            color: var(--color-warning);
        }

        .action-row {
            display: flex;
            gap: var(--space-sm);
            flex-wrap: wrap;
            margin-bottom: var(--space-md);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--text-sm);
        }

        th, td {
            text-align: left;
            padding: var(--space-sm);
            border-bottom: 1px solid var(--color-rule);
        }

        td {
            font-family: var(--font-mono);
            font-variant-numeric: tabular-nums;
        }

        td:nth-child(2) {
            font-family: var(--font-body);
        }

        th {
            font-family: var(--font-body);
            color: var(--color-ink-2);
            font-size: var(--text-xs);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .empty-state {
            text-align: center;
            padding: var(--space-xl);
            color: var(--color-neutral);
        }

        .bracket-groups {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: var(--space-md);
            margin-top: var(--space-md);
        }

        .group-card {
            padding: var(--space-md);
            background: var(--color-paper-2);
            border: 1px solid var(--color-rule);
            border-radius: var(--radius);
        }

        .group-card h4 {
            font-family: var(--font-display);
            font-weight: 700;
            color: var(--color-ink-2);
            margin-bottom: var(--space-sm);
        }

        .group-team {
            padding: 0.5rem 0.75rem;
            background: var(--color-paper);
            border: 1px solid var(--color-rule);
            border-radius: var(--radius);
            margin-bottom: var(--space-xs);
            font-size: var(--text-sm);
        }

        .section-card {
            background: var(--color-paper);
            border: 1px solid var(--color-rule);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
        }

        .overflow-x { overflow-x: auto; }

        @media (max-width: 640px) {
            .bracket-groups { grid-template-columns: minmax(0, 1fr); }

            .container {
                padding: var(--space-sm);
                gap: var(--space-md);
            }

            header {
                flex-wrap: wrap;
                gap: var(--space-sm);
            }

            h1 {
                font-size: 1.4rem;
            }

            .section-card {
                padding: var(--space-md);
            }

            .stats-bar {
                gap: var(--space-sm);
            }

            .stat-pill {
                flex: 1 1 40%;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar > div {
                display: flex;
                flex-direction: column;
                gap: var(--space-sm);
            }

            .action-row {
                flex-direction: column;
            }

            .action-row .btn {
                width: 100%;
            }

            .team-card-header {
                flex-direction: column;
            }

            input {
                font-size: 16px;
            }

            table {
                font-size: 0.78rem;
            }

            th, td {
                padding: 0.5rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: 150ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Panel Admin</h1>
            <button class="btn btn-ghost" id="logoutBtn" style="display:none;">Cerrar sesión</button>
        </header>

        <section id="loginSection">
            <h2>Acceso privado</h2>
            <div class="alert alert-error" id="loginError"></div>
            <form id="loginForm">
                <div class="form-group" style="margin-bottom: var(--space-md);">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="username">
                </div>
                <div class="form-group" style="margin-bottom: var(--space-md);">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;" id="loginBtn">Entrar</button>
            </form>
        </section>

        <section id="adminSection">
            <div class="alert alert-success" id="successAlert"></div>
            <div class="alert alert-error" id="errorAlert"></div>

            <div class="stats-bar">
                <div class="stat-pill"><strong id="statTotal">0</strong>Equipos (máx. 12)</div>
                <div class="stat-pill"><strong id="statPaid">0</strong>Pagados</div>
                <div class="stat-pill"><strong id="statPending">0</strong>Pendientes</div>
                <div class="stat-pill"><strong id="statPlayers">0</strong>Jugadores</div>
            </div>

            <div class="section-card">
                <div class="toolbar">
                    <h2 style="font-family: var(--font-display); font-weight: 800; color: var(--color-ink-2);">Visibilidad pública</h2>
                    <button class="btn btn-secondary" id="toggleVisibilityBtn">Mostrar equipos al público</button>
                </div>
                <p style="font-size: var(--text-sm); color: var(--color-neutral);" id="visibilityStatus">Cargando estado...</p>
            </div>

            <div class="section-card">
                <div class="toolbar">
                    <h2 style="font-family: var(--font-display); font-weight: 800; color: var(--color-ink-2);">Sorteo del torneo</h2>
                    <div style="display:flex; gap: var(--space-sm);">
                        <button class="btn btn-secondary" id="drawBtn">Cerrar inscripciones y sortear</button>
                        <button class="btn btn-danger" id="resetDrawBtn" style="display:none;">Reiniciar sorteo</button>
                    </div>
                </div>
                <div id="bracketDisplay"></div>
            </div>

            <div class="section-card">
                <h2 style="font-family: var(--font-display); font-weight: 800; color: var(--color-ink-2); margin-bottom: var(--space-md);">Equipos inscritos</h2>
                <div id="teamsList"></div>
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script>
        const SUPABASE_URL = 'https://xehgsfzdffuqvlwxfrpi.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlaGdzZnpkZmZ1cXZsd3hmcnBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyMjU1MTksImV4cCI6MjEwMTgwMTUxOX0.Et60SK7B5IB9VghBXBrZxBhe5_icYErRD9S9f1K7Wt0';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        function showAlert(id, message) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 6000);
        }

        async function checkSession() {
            const { data } = await sb.auth.getSession();
            if (data.session) {
                showAdmin();
            } else {
                showLogin();
            }
        }

        function showLogin() {
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('adminSection').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
        }

        function showAdmin() {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminSection').style.display = 'block';
            document.getElementById('logoutBtn').style.display = 'inline-block';
            loadTeams();
            loadTournament();
            loadVisibility();
        }

        async function loadVisibility() {
            const { data, error } = await sb.from('site_settings').select('show_teams_list').eq('id', 1).maybeSingle();
            const btn = document.getElementById('toggleVisibilityBtn');
            const status = document.getElementById('visibilityStatus');

            if (error || !data) {
                status.textContent = 'No se pudo cargar el estado.';
                return;
            }

            if (data.show_teams_list) {
                btn.textContent = 'Ocultar equipos al público';
                status.textContent = 'La lista de equipos inscritos es visible en la web pública.';
            } else {
                btn.textContent = 'Mostrar equipos al público';
                status.textContent = 'La lista de equipos inscritos está oculta para el público.';
            }
        }

        document.getElementById('toggleVisibilityBtn').addEventListener('click', async () => {
            const { data } = await sb.from('site_settings').select('show_teams_list').eq('id', 1).maybeSingle();
            const newValue = !(data && data.show_teams_list);
            const { error } = await sb.from('site_settings').update({ show_teams_list: newValue }).eq('id', 1);
            if (error) {
                showAlert('errorAlert', 'Error al actualizar visibilidad: ' + error.message);
                return;
            }
            showAlert('successAlert', newValue ? 'Equipos ahora visibles al público' : 'Equipos ahora ocultos al público');
            loadVisibility();
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginBtn = document.getElementById('loginBtn');
            loginBtn.disabled = true;
            loginBtn.textContent = 'Entrando...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            const { error } = await sb.auth.signInWithPassword({ email, password });

            loginBtn.disabled = false;
            loginBtn.textContent = 'Entrar';

            if (error) {
                showAlert('loginError', 'Credenciales incorrectas');
                return;
            }
            showAdmin();
        });

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await sb.auth.signOut();
            showLogin();
        });

        async function loadTeams() {
            const { data: teams, error } = await sb
                .from('teams')
                .select('*, players(*)')
                .order('created_at', { ascending: false });

            if (error) {
                showAlert('errorAlert', 'Error al cargar equipos: ' + error.message);
                return;
            }

            renderStats(teams);
            renderTeamsList(teams);
        }

        function renderStats(teams) {
            const totalPlayers = teams.reduce((sum, t) => sum + (t.players?.length || 0), 0);
            const paid = teams.filter(t => t.payment_status === 'paid').length;
            document.getElementById('statTotal').textContent = teams.length;
            document.getElementById('statPaid').textContent = paid;
            document.getElementById('statPending').textContent = teams.length - paid;
            document.getElementById('statPlayers').textContent = totalPlayers;
        }

        function renderTeamsList(teams) {
            const list = document.getElementById('teamsList');

            if (teams.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>Aún no hay equipos inscritos.</p></div>';
                return;
            }

            list.innerHTML = teams.map(team => `
                <div class="team-card ${team.payment_status === 'paid' ? 'paid' : ''}">
                    <div class="team-card-header">
                        <div>
                            <div class="team-name">${escapeHtml(team.name)}</div>
                            <div class="team-meta">
                                Capitán: ${escapeHtml(team.captain_name)}<br>
                                Tel: ${escapeHtml(team.captain_phone)} | Email: ${escapeHtml(team.captain_email)}<br>
                                Inscrito: ${new Date(team.created_at).toLocaleString('es-ES')}
                            </div>
                        </div>
                        <span class="payment-pill ${team.payment_status === 'paid' ? 'paid' : 'pending'}">
                            ${team.payment_status === 'paid' ? 'Pagado' : 'Pendiente'}
                        </span>
                    </div>

                    <div class="action-row">
                        ${team.payment_status === 'paid'
                            ? `<button class="btn btn-warning btn-sm" onclick="setPaymentStatus('${team.id}', 'pending')">Marcar Pendiente</button>`
                            : `<button class="btn btn-success btn-sm" onclick="setPaymentStatus('${team.id}', 'paid')">Marcar Pagado</button>`
                        }
                        ${team.payment_proof_path
                            ? `<button class="btn btn-ghost btn-sm" onclick="viewProof('${team.payment_proof_path}')">Ver Justificante</button>`
                            : `<span style="font-size:var(--text-sm); color: var(--color-neutral);">Sin justificante</span>`
                        }
                        <button class="btn btn-danger btn-sm" onclick="deleteTeam('${team.id}', '${team.payment_proof_path || ''}')">Eliminar Equipo</button>
                    </div>

                    <div class="overflow-x">
                        <table>
                            <thead>
                                <tr><th>#</th><th>Nombre</th><th>DNI</th><th>Nacimiento</th><th>Talla 1ª</th><th>Talla 2ª</th></tr>
                            </thead>
                            <tbody>
                                ${(team.players || []).map((p, i) => `
                                    <tr>
                                        <td>${i + 1}</td>
                                        <td>${escapeHtml(p.name)}</td>
                                        <td>${escapeHtml(p.dni)}</td>
                                        <td>${p.birth_date}</td>
                                        <td>${p.shirt_size}</td>
                                        <td>${p.shirt_size_2 || '—'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str ?? '';
            return div.innerHTML;
        }

        async function setPaymentStatus(teamId, status) {
            const { error } = await sb.from('teams').update({ payment_status: status }).eq('id', teamId);
            if (error) {
                showAlert('errorAlert', 'Error al actualizar pago: ' + error.message);
                return;
            }
            showAlert('successAlert', 'Estado de pago actualizado');
            loadTeams();
        }

        async function viewProof(path) {
            const { data, error } = await sb.storage.from('payment-proofs').createSignedUrl(path, 300);
            if (error) {
                showAlert('errorAlert', 'No se pudo abrir el justificante: ' + error.message);
                return;
            }
            window.open(data.signedUrl, '_blank');
        }

        async function deleteTeam(teamId, proofPath) {
            if (!confirm('¿Eliminar este equipo y todos sus datos? Esta acción no se puede deshacer.')) return;

            const { error } = await sb.from('teams').delete().eq('id', teamId);
            if (error) {
                showAlert('errorAlert', 'Error al eliminar: ' + error.message);
                return;
            }

            if (proofPath) {
                await sb.storage.from('payment-proofs').remove([proofPath]);
            }

            showAlert('successAlert', 'Equipo eliminado');
            loadTeams();
        }

        async function loadTournament() {
            const { data } = await sb.from('tournament_state').select('*').eq('id', 1).maybeSingle();
            const bracketDisplay = document.getElementById('bracketDisplay');
            const resetBtn = document.getElementById('resetDrawBtn');
            const drawBtn = document.getElementById('drawBtn');

            if (!data) {
                bracketDisplay.innerHTML = '<p style="color: var(--color-neutral); margin-top: var(--space-md);">Sorteo no realizado todavía.</p>';
                resetBtn.style.display = 'none';
                drawBtn.style.display = 'inline-block';
                return;
            }

            drawBtn.style.display = 'none';
            resetBtn.style.display = 'inline-block';

            bracketDisplay.innerHTML = `
                <div class="bracket-groups">
                    ${['A', 'B'].map(g => `
                        <div class="group-card">
                            <h4>Grupo ${g}</h4>
                            ${(data.groups[g] || []).map(t => `<div class="group-team">${escapeHtml(t.name)}</div>`).join('')}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        document.getElementById('drawBtn').addEventListener('click', async () => {
            const { data: teams, error } = await sb.from('teams').select('id, name').order('name');
            if (error || !teams || teams.length < 2) {
                showAlert('errorAlert', 'Se necesitan al menos 2 equipos para sortear');
                return;
            }

            const shuffled = [...teams].sort(() => Math.random() - 0.5);
            const mid = Math.ceil(shuffled.length / 2);
            const groups = { A: shuffled.slice(0, mid), B: shuffled.slice(mid) };

            const { error: upsertError } = await sb.from('tournament_state').upsert({ id: 1, groups });
            if (upsertError) {
                showAlert('errorAlert', 'Error al guardar sorteo: ' + upsertError.message);
                return;
            }

            showAlert('successAlert', 'Sorteo realizado correctamente');
            loadTournament();
        });

        document.getElementById('resetDrawBtn').addEventListener('click', async () => {
            if (!confirm('¿Reiniciar el sorteo? Se borrarán los grupos actuales.')) return;
            const { error } = await sb.from('tournament_state').delete().eq('id', 1);
            if (error) {
                showAlert('errorAlert', 'Error al reiniciar: ' + error.message);
                return;
            }
            showAlert('successAlert', 'Sorteo reiniciado');
            loadTournament();
        });

        checkSession();
    </script>
</body>
</html>
